name: Release

on:
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release title (e.g., "Release v0.2.0")'
        required: true
        type: string
      release_notes:
        description: 'Release notes (markdown format)'
        required: true
        type: string
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:engine

      - name: Build project
        run: pnpm build

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ steps.version.outputs.version }}" || echo "Tag already exists"
          git push origin "v${{ steps.version.outputs.version }}" || echo "Tag already pushed"

      - name: Fetch Contributors
        id: contributors
        run: |
          # Get contributors since last tag using GitHub API
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all contributors
            CONTRIBUTORS_JSON=$(gh api repos/${{ github.repository }}/contributors --jq '.[].login')
          else
            # Get contributors who committed since last tag
            CONTRIBUTORS_JSON=$(gh api repos/${{ github.repository }}/commits?since=$(git log -1 --format=%ci "$PREV_TAG" | cut -d' ' -f1-2 | tr ' ' 'T') --jq '[.[].author.login] | unique')
          fi
          
          # Format as @mentions for avatars
          if [ -n "$CONTRIBUTORS_JSON" ]; then
            CONTRIBUTORS=$(echo "$CONTRIBUTORS_JSON" | jq -r '.[] | "@\(.),"') | tr -d '\n' | sed 's/,$//'
          fi
          
          if [ -z "$CONTRIBUTORS" ]; then
            echo "contributors_list<<EOF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "contributors_list<<EOF" >> $GITHUB_OUTPUT
            echo "## 🤝 New Contributors" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$CONTRIBUTORS" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ github.event.inputs.release_title }}
          body: |            
            ${{ github.event.inputs.release_notes }}

            ${{ steps.contributors.outputs.contributors_list }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          make_latest: true

