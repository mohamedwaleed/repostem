name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:engine

      - name: Build project
        run: pnpm build

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Check if tag already exists
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, skipping tag creation"
          else
            git tag v${{ steps.version.outputs.version }}
            git push origin v${{ steps.version.outputs.version }}
          fi

      - name: Create or Update GitHub Release
        run: |
          # Check if release already exists
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists, updating..."
            gh release edit "v${{ steps.version.outputs.version }}" \
              --title "Release v${{ steps.version.outputs.version }}" \
              --draft=false \
              --prerelease=${{ github.event.inputs.prerelease }} \
              --notes "## Changes in v${{ steps.version.outputs.version }}
            
            ### Features
            - CLI tool with 5 commands (analyze, risk, ask, cycles, impact)
            - Structural risk analysis with AI-powered explanations
            - Dependency graph construction for JS/TS repositories
            - Circular dependency detection
            - Configuration support with ignore patterns
            
            ### Installation
            \`\`\`bash
            pnpm install -g @repostem/cli
            \`\`\`
            
            ### Quick Start
            \`\`\`bash
            repostem analyze /path/to/your/repo
            \`\`\`"
          else
            echo "Creating new release v${{ steps.version.outputs.version }}..."
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "Release v${{ steps.version.outputs.version }}" \
              --draft=false \
              --prerelease=${{ github.event.inputs.prerelease }} \
              --notes "## Changes in v${{ steps.version.outputs.version }}
            
            ### Features
            - CLI tool with 5 commands (analyze, risk, ask, cycles, impact)
            - Structural risk analysis with AI-powered explanations
            - Dependency graph construction for JS/TS repositories
            - Circular dependency detection
            - Configuration support with ignore patterns
            
            ### Installation
            \`\`\`bash
            pnpm install -g @repostem/cli
            \`\`\`
            
            ### Quick Start
            \`\`\`bash
            repostem analyze /path/to/your/repo
            \`\`\`"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI to npm
        run: |
          cd apps/cli
          pnpm build
          # Check if version already exists on npm
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME="@repostem/cli"
          
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already exists on npm, skipping publish"
          else
            echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION to npm"
            npm publish --access public
          fi
